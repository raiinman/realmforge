name: Realmforge independent Gate

on:
  push:
    branches:
      - rebuild/realmforge-independent-gate
      - 'rebuild/gate-*'
    paths:
      - 'components/gate-independent/**'
      - 'docs/INDEPENDENT_GATE_REBUILD.md'
      - '.github/workflows/independent-gate.yml'
  pull_request:
    paths:
      - 'components/gate-independent/**'
      - 'docs/INDEPENDENT_GATE_REBUILD.md'
      - '.github/workflows/independent-gate.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce independent source boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'components/gate/|third_party/gate-upstream|tavern' components/gate-independent; then
            echo 'Independent Gate must not reference the covered implementation or frozen upstream tree.' >&2
            exit 1
          fi
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup component add rustfmt --toolchain 1.97.0
      - name: Format check
        run: cargo +1.97.0 fmt --manifest-path components/gate-independent/Cargo.toml -- --check
      - name: Test independent Gate foundation
        run: cargo +1.97.0 test --manifest-path components/gate-independent/Cargo.toml
