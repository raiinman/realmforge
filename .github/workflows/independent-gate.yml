name: Realmforge independent Gate

on:
  push:
    branches:
      - rebuild/realmforge-independent-gate
      - 'rebuild/gate-*'
    paths:
      - 'components/gate-independent/**'
      - 'docs/INDEPENDENT_GATE_REBUILD.md'
      - '.github/workflows/independent-gate.yml'
  pull_request:
    paths:
      - 'components/gate-independent/**'
      - 'docs/INDEPENDENT_GATE_REBUILD.md'
      - '.github/workflows/independent-gate.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-independent-gate
    steps:
      - uses: actions/checkout@v4
      - name: Enforce independent source boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'components/gate/|third_party/gate-upstream|tavern' \
            components/gate-independent/src \
            components/gate-independent/Cargo.toml; then
            echo 'Independent Gate implementation must not reference the covered implementation or frozen upstream tree.' >&2
            exit 1
          fi
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup component add rustfmt --toolchain 1.97.0
      - name: Format check
        run: cargo +1.97.0 fmt --manifest-path components/gate-independent/Cargo.toml -- --check
      - name: Test independent Gate foundation
        run: cargo +1.97.0 test --manifest-path components/gate-independent/Cargo.toml
      - name: Build standalone Gate processes
        run: cargo +1.97.0 build --manifest-path components/gate-independent/Cargo.toml --bins
      - name: Smoke capture bundle initializer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/realmforge-capture-init-smoke
          "$CARGO_TARGET_DIR/debug/realmforge-gate-capture-init" \
            --out /tmp/realmforge-capture-init-smoke \
            --id synthetic-capture-init-001 \
            --family synthetic \
            --version 0 \
            --build 1 \
            --platform linux \
            --arch x86_64 \
            --exe /bin/true \
            --os 'GitHub Actions Ubuntu' \
            --topology 'loopback synthetic test' \
            --server-revision ci \
            --scenario 'capture initializer smoke test' \
            --expected 'emit hashed first-party seed manifest' \
            > /tmp/capture-init.out

          test -s /tmp/realmforge-capture-init-smoke/manifest.json
          grep -F 'capture_id=synthetic-capture-init-001' /tmp/capture-init.out
          grep -E 'client_sha256=[0-9a-f]{64}' /tmp/capture-init.out
          grep -F 'implementation_ready=false' /tmp/capture-init.out
          grep -F '"evidence_grade": "first_party"' /tmp/realmforge-capture-init-smoke/manifest.json
          grep -F '"observations": []' /tmp/realmforge-capture-init-smoke/manifest.json

          "$CARGO_TARGET_DIR/debug/realmforge-gate-fixture-check" \
            /tmp/realmforge-capture-init-smoke/manifest.json

          if "$CARGO_TARGET_DIR/debug/realmforge-gate-fixture-check" \
            /tmp/realmforge-capture-init-smoke/manifest.json --implementation-ready; then
            echo 'seed manifest unexpectedly became implementation-ready without observations' >&2
            exit 1
          fi

      - name: Smoke standalone Gate HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          export REALMFORGE_GATE_BIND=127.0.0.1:18080
          export REALMFORGE_GATE_ISSUER=http://127.0.0.1:18080

          if "$CARGO_TARGET_DIR/debug/realmforge-gate" > /tmp/missing-key.log 2>&1; then
            echo 'Gate unexpectedly started without REALMFORGE_GATE_SIGNING_KEY' >&2
            exit 1
          fi
          grep -F 'REALMFORGE_GATE_SIGNING_KEY' /tmp/missing-key.log

          "$CARGO_TARGET_DIR/debug/realmforge-gate-keygen" /tmp/realmforge-gate-signing.pem
          test "$(stat -c '%a' /tmp/realmforge-gate-signing.pem)" = "600"
          export REALMFORGE_GATE_SIGNING_KEY=/tmp/realmforge-gate-signing.pem

          "$CARGO_TARGET_DIR/debug/realmforge-gate" > /tmp/realmforge-gate.log 2>&1 &
          gate_pid=$!
          cleanup() {
            kill "$gate_pid" 2>/dev/null || true
            wait "$gate_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/health.json; then
              break
            fi
            sleep 0.2
          done

          grep -F '"status":"ok"' /tmp/health.json
          grep -F '"service":"realmforge-gate"' /tmp/health.json

          curl -fsS http://127.0.0.1:18080/.well-known/openid-configuration > /tmp/discovery.json
          grep -F '"issuer":"http://127.0.0.1:18080"' /tmp/discovery.json
          grep -F '"authorization_endpoint":"http://127.0.0.1:18080/authorize"' /tmp/discovery.json
          grep -F '"token_endpoint":"http://127.0.0.1:18080/token"' /tmp/discovery.json
          grep -F '"jwks_uri":"http://127.0.0.1:18080/jwks.json"' /tmp/discovery.json
          grep -F '"code_challenge_methods_supported":["S256"]' /tmp/discovery.json

          curl -fsS http://127.0.0.1:18080/jwks.json > /tmp/jwks.json
          grep -F '"kty":"RSA"' /tmp/jwks.json
          grep -F '"use":"sig"' /tmp/jwks.json
          grep -F '"alg":"RS256"' /tmp/jwks.json
          grep -E '"kid":"[A-Za-z0-9_-]{43}"' /tmp/jwks.json
          grep -E '"n":"[A-Za-z0-9_-]+"' /tmp/jwks.json
          grep -E '"e":"[A-Za-z0-9_-]+"' /tmp/jwks.json

          authorize_status=$(curl -sS -o /tmp/authorize.json -w '%{http_code}' \
            'http://127.0.0.1:18080/authorize?response_type=code&client_id=client-1&redirect_uri=https%3A%2F%2Fclient.example%2Fcallback&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256')
          test "$authorize_status" = "401"
          grep -F '"error":"login_required"' /tmp/authorize.json

          token_status=$(curl -sS -o /tmp/token.json -w '%{http_code}' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'grant_type=authorization_code&code=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&client_id=client-1&redirect_uri=https%3A%2F%2Fclient.example%2Fcallback&code_verifier=dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk' \
            http://127.0.0.1:18080/token)
          test "$token_status" = "400"
          grep -F '"error":"invalid_grant"' /tmp/token.json

      - name: Smoke protocol-neutral capture observer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/realmforge-observer-smoke
          mkdir -p /tmp/realmforge-observer-smoke
          cp components/gate-independent/tests/fixtures/observer-seed.json \
            /tmp/realmforge-observer-smoke/manifest.json

          "$CARGO_TARGET_DIR/debug/realmforge-gate-observer" \
            --manifest /tmp/realmforge-observer-smoke/manifest.json \
            --bind 127.0.0.1:19090 \
            --timeout-seconds 5 \
            > /tmp/observer.out 2> /tmp/observer.err &
          observer_pid=$!
          cleanup_observer() {
            kill "$observer_pid" 2>/dev/null || true
            wait "$observer_pid" 2>/dev/null || true
          }
          trap cleanup_observer EXIT

          python3 - <<'PY'
          import socket
          import time

          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 19090), timeout=1) as sock:
                      sock.sendall(b"realmforge-synthetic-probe")
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("observer did not accept connections")
          PY

          wait "$observer_pid"
          trap - EXIT

          test -s /tmp/realmforge-observer-smoke/artifacts/observer-tcp-001.bin
          grep -F 'capture_id=synthetic-ci-observer-001' /tmp/observer.out
          grep -F 'implementation_ready=false' /tmp/observer.out
          grep -F '"operation": "accept_connection"' /tmp/realmforge-observer-smoke/manifest.json
          grep -F '"operation": "receive_bytes"' /tmp/realmforge-observer-smoke/manifest.json
          grep -F '"contains_secrets": true' /tmp/realmforge-observer-smoke/manifest.json
          grep -F '"redaction_status": "not_reviewed"' /tmp/realmforge-observer-smoke/manifest.json

          "$CARGO_TARGET_DIR/debug/realmforge-gate-fixture-check" \
            /tmp/realmforge-observer-smoke/manifest.json

          if "$CARGO_TARGET_DIR/debug/realmforge-gate-fixture-check" \
            /tmp/realmforge-observer-smoke/manifest.json --implementation-ready; then
            echo 'raw observer fixture unexpectedly became implementation-ready before review' >&2
            exit 1
          fi
