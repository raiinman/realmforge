syntax = "proto2";
package bgs.protocol;

// --- Core types (from rpc_types.proto) ---

message NO_RESPONSE {}
message NoData {}

message ProcessId {
  required uint32 label = 1;
  required uint32 epoch = 2;
}

message ObjectAddress {
  required ProcessId host = 1;
  optional uint32 object_id = 2;
}

// --- Content handle (from content_handle_types.proto) ---

message ContentHandle {
  required fixed32 region = 1;
  required fixed32 usage = 2;
  required bytes hash = 3;
  optional string proto_url = 4;
}

// --- RPC frame header ---
//
// Authoritative wire format from protobuf-decompiler FileDescriptorProto
// extractions. Fields 1-13: all versions (1.13.2 through 4.4.2).
// Fields 14-20: 1.14.0+ fanout routing additions (skipped as unknown
// fields by 1.13.2 proto2 decoders).
message Header {
  required uint32 service_id = 1;
  optional uint32 method_id = 2;
  required uint32 token = 3;
  optional uint64 object_id = 4 [default = 0];
  optional uint32 size = 5 [default = 0];
  optional uint32 status = 6 [default = 0];
  repeated ErrorInfo error = 7;
  optional uint64 timeout = 8;
  optional bool is_response = 9;
  repeated ProcessId forward_targets = 10;
  optional fixed32 service_hash = 11;
  optional string client_id = 13;
  repeated FanoutTarget fanout_target = 14;
  repeated string client_id_fanout_target = 15;
  optional bytes client_record = 16;
  optional bytes original_sender = 17;
  optional uint32 sender_token = 18;
  optional uint32 router_label = 19;
  optional string error_reason = 20;
}

// ErrorInfo is a repeated field in Header for structured error reporting.
message ErrorInfo {
  required uint32 code = 1;
  optional string message = 2;
}

// FanoutTarget — 1.14.0+ only (rpc_types.proto). Used by the server for
// multi-client message distribution. Tavern does not populate these fields
// in single-server mode; absent from the 1.13.2 wire surface.
message FanoutTarget {
  optional string client_id = 1;
  optional bytes key = 2;
  optional uint64 object_id = 3;
}

// --- ConnectionService (from connection_service.proto) ---
// Service descriptor name: bnet.protocol.connection.ConnectionService
// FNV-1a hash: 0x65446991

message ConnectRequest {
  optional ProcessId client_id = 1;
  optional BindRequest bind_request = 2;
  optional bool use_bindless_rpc = 3 [default = true];
}

message ConnectResponse {
  required ProcessId server_id = 1;
  optional ProcessId client_id = 2;
  optional uint32 bind_result = 3;
  optional BindResponse bind_response = 4;
  optional ConnectionMeteringContentHandles content_handle_array = 5;
  optional uint64 server_time = 6;
  optional bool use_bindless_rpc = 7 [default = false];
  optional ConnectionMeteringContentHandles binary_content_handle_array = 8;
}

message ConnectionMeteringContentHandles {
  repeated ContentHandle content_handle = 1;
}

message BoundService {
  required fixed32 hash = 1;
  required uint32 id = 2;
}

message BindRequest {
  repeated fixed32 deprecated_imported_service_hash = 1 [packed = true, deprecated = true];
  repeated BoundService deprecated_exported_service = 2 [deprecated = true];
  repeated BoundService exported_service = 3;
  repeated BoundService imported_service = 4;
}

message BindResponse {
  repeated uint32 imported_service_id = 1 [packed = true, deprecated = true];
}

message DisconnectRequest {
  required uint32 error_code = 1;
}

message DisconnectNotification {
  required uint32 error_code = 1;
  optional string reason = 2;
}

// --- AuthenticationService (from authentication_service.proto) ---
// Service descriptor name: bnet.protocol.authentication.AuthenticationService
// FNV-1a hash: 0x7F55071D (bnet.protocol.authentication.AuthenticationService)
//
// NOTE: For WoW Classic 1.13.2 (BGS v1), the correct descriptor is
// "bnet.protocol.authentication.AuthenticationServer" (hash 0x0DECFC01).
// The tavern_bgs::service_hash constants should be updated to include the
// v1 hashes.

message LogonRequest {
  optional string program = 1;
  optional string platform = 2;
  optional string locale = 3;
  optional string email = 4;
  optional string version = 5;
  optional int32 application_version = 6;
  optional bool public_computer = 7;
  optional bool allow_logon_queue_notifications = 10 [default = false];
  optional bytes cached_web_credentials = 12;
  optional string user_agent = 14;
  optional string device_id = 15;
  optional string phone_number = 16;
  optional string auth_platform = 17;
  optional uint64 compatibility = 18;  // v2: LogonRequest3 Compatibility field
}

// VerifyWebCredentialsRequest carries the login ticket / WEB_TOKEN bytes
// from the in-client login or launcher-login flow. Used by WoW Classic
// 1.13.2 (BGS v1) as the second step of a two-step authentication.
message VerifyWebCredentialsRequest {
  optional bytes web_credentials = 1;
}

// GenerateSSOToken — method 5 on AuthenticationServer.
// Returns sso_id and sso_secret for the SSO session handoff.
message GenerateSSOTokenRequest {
  optional fixed32 program = 1;
}

message GenerateSSOTokenResponse {
  optional bytes sso_id = 1;
  optional bytes sso_secret = 2;
}

// GenerateWebCredentials — AuthenticationServer method 8 (v1).
// Issues a WEB_TOKEN for launcher-login handoff to the game client.
// The desktop app (Phoenix) calls this to bridge BGS v2 → v1. The 1.13.2
// Classic client never calls it.
message GenerateWebCredentialsRequest {
  optional fixed32 program = 1;
}

message GenerateWebCredentialsResponse {
  optional bytes web_credentials = 1;
}

// SelectGameAccount — AuthenticationServer method 6 (deprecated).
// CORRECTION (2026-08-02): the earlier 'method 9' attribution came from a
// demangled-name shift — method 9 is GameUtilities GetAchievementsFile.
// The 1.13.2 client never dispatches auth method 6 (game-account
// selection is local; the realm join carries the account).
message SelectGameAccountRequest {
  required EntityId game_account_id = 1;
}

// GameAccountSelectedRequest — AuthenticationClient listener method 14
// (server push only). The 1.13.2 client listens for it but never triggers
// it via a C->S call (selection is local; no SelectGameAccount RPC).
message GameAccountSelectedRequest {
  required uint32 result = 1;
  optional EntityId game_account_id = 2;
}

// LogonResult — BGS v1 wire format (WoW Classic 1.13.2 / 1.14.0).
//
// Fields 1-10 are identical across both 1.13.2 and 1.14.0.
// Field 11 (client_id) was added in 1.14.0; 1.13.2 ignores it
// because proto2 decoders skip unknown optional fields.
// sso_id and sso_secret are NOT in LogonResult — they are in
// GenerateSSOTokenResponse (method 5).
//
// For newer Classic generations (2.5+/3.4/4.4) that use BGS v2,
// a separate LogonResultV2 message should be defined.
message LogonResult {
  required uint32 error_code = 1;
  optional EntityId account_id = 2;
  repeated EntityId game_account_id = 3;
  optional string email = 4;
  repeated uint32 available_region = 5;
  optional uint32 connected_region = 6;
  optional string battle_tag = 7;
  optional string geoip_country = 8;
  optional bytes session_key = 9;
  optional bool restricted_mode = 10;
  optional string client_id = 11;
}

// LogonResponse3 — v2 OnLogonComplete replacement (AuthenticationListener method 1).
// Minimal implementation: sends account/game account data, fills rest with defaults.
message LogonResponse3 {
  optional uint32 error_code = 1;
  repeated EntityId game_account_id = 2;
  optional string battle_tag = 3;
  optional bytes session_key = 4;
  optional uint32 ping_timeout = 5;
  optional string given_name = 6;
  optional string surname = 7;
  optional uint32 account_id_v2 = 8;
  optional uint32 region = 9;
  optional uint64 account_flags = 10;
  optional uint32 game_account_region = 11;
  optional string game_account_name = 12;
  optional uint64 game_account_flags = 13;
  optional uint32 logon_failures = 14;
}

message GameAccountHandle {
  required fixed32 id = 1;
  required fixed32 program = 2;
  required uint32 region = 3;
}

message AccountLicense {
  required uint32 id = 1;
  optional uint64 expires = 2;
}

// --- AccountService messages ---
// Field numbers match the 1.13.2/1.14.0 client protos
// (account_types.proto from protobuf-decompiler/output/<version>).

message AccountId {
  required fixed32 id = 1;
}

message ResolveAccountResponse {
  optional AccountId id = 12;
}

message AccountLevelInfo {
  repeated AccountLicense licenses = 3;
  optional fixed32 default_currency = 4;
  optional string country = 5;
  optional uint32 preferred_region = 6;
  optional string full_name = 7;
  optional string battle_tag = 8;
  optional bool muted = 9;
  optional bool manual_review = 10;
  optional bool account_paid_any = 11;
  optional string email = 13;
  optional bool headless_account = 14;
  optional bool test_account = 15;
  optional bool is_sms_protected = 17;
}

message PrivacyInfo {
  optional bool is_using_rid = 3;
  optional bool is_visible_for_view_friends = 4;
  optional bool is_hidden_from_friend_finder = 5;
  optional uint32 game_info_privacy = 6;
  optional bool only_allow_friend_whispers = 7;
}

message ParentalControlInfo {
  optional string timezone = 3;
  optional uint32 minutes_per_day = 4;
  optional uint32 minutes_per_week = 5;
  optional bool can_receive_voice = 6;
  optional bool can_send_voice = 7;
  repeated bool play_schedule = 8;
  optional bool can_join_group = 9;
  optional bool can_use_profile = 10;
  optional bool in_game_purchase_disabled = 11;
}

message GameLevelInfo {
  optional bool is_trial = 4;
  optional bool is_lifetime = 5;
  optional bool is_restricted = 6;
  optional bool is_beta = 7;
  optional string name = 8;
  optional fixed32 program = 9;
  repeated AccountLicense licenses = 10;
  optional uint32 realm_permissions = 11;
}

message GameTimeInfo {
  optional bool is_unlimited_play_time = 3;
  optional uint64 play_time_expires = 5;
  optional bool is_subscription = 6;
  optional bool is_recurring_subscription = 7;
}

message GameStatus {
  optional bool is_suspended = 4;
  optional bool is_banned = 5;
  optional uint64 suspension_expires = 6;
  optional fixed32 program = 7;
  optional bool is_locked = 8;
  optional bool is_bam_unlockable = 9;
}

message GameAccountList {
  optional uint32 region = 3;
  repeated GameAccountHandle handle = 4;
}

// SecurityStatus — 1.14.0+ only (AccountState field 8); absent from the
// 1.13.2 account_types.proto. The 1.13.2 client skips it as unknown.
message SecurityStatus {
  optional bool sms_protect_enabled = 1;
  optional bool email_verified = 2;
  optional bool authenticator_enabled = 3;
  optional bool sqa_enabled = 4;
  optional bool authenticator_required = 5;
}

message AccountState {
  optional AccountLevelInfo account_level_info = 1;
  optional PrivacyInfo privacy_info = 2;
  optional ParentalControlInfo parental_control_info = 3;
  repeated GameLevelInfo game_level_info = 5;
  repeated GameStatus game_status = 6;
  repeated GameAccountList game_accounts = 7;
  optional SecurityStatus security_status = 8;
}

message GameAccountState {
  optional GameLevelInfo game_level_info = 1;
  optional GameTimeInfo game_time_info = 2;
  optional GameStatus game_status = 3;
  optional RAFInfo raf_info = 4;
}

// RAFInfo — v1: 1.13.2/1.14.0 (GameAccountState field 4). Recruit-a-friend
// blob; tavern does not populate it.
message RAFInfo {
  optional bytes raf_info = 1;
}

// GameAccountFieldOptions — v1: 1.13.2/1.14.0. The client requests which
// GameAccountState fields it wants (GetGameAccountStateRequest.options = 10).
message GameAccountFieldOptions {
  optional bool all_fields = 1;
  optional bool field_game_level_info = 2;
  optional bool field_game_time_info = 3;
  optional bool field_game_status = 4;
  optional bool field_raf_info = 5;
}

// GameAccountFieldTags — v1: 1.13.2/1.14.0. Per-field tags
// (GetGameAccountStateRequest.tags = 11).
message GameAccountFieldTags {
  optional fixed32 game_level_info_tag = 2;
  optional fixed32 game_time_info_tag = 3;
  optional fixed32 game_status_tag = 4;
  optional fixed32 raf_info_tag = 5;
}

message GetAccountStateRequest {
  optional EntityId entity_id = 1;
  optional uint32 program = 2;
  optional uint32 region = 3;
  optional AccountFieldOptions options = 10;
  optional AccountFieldTags tags = 11;
}

// AccountFieldOptions — v1: 1.13.2/1.14.0. The client requests which
// AccountState fields it wants (GetAccountStateRequest.options = 10).
message AccountFieldOptions {
  optional bool all_fields = 1;
  optional bool field_account_level_info = 2;
  optional bool field_privacy_info = 3;
  optional bool field_parental_control_info = 4;
  optional bool field_game_level_info = 6;
  optional bool field_game_status = 7;
  optional bool field_game_accounts = 8;
}

// AccountFieldTags — v1: 1.13.2/1.14.0. Per-field tags
// (GetAccountStateRequest.tags = 11).
message AccountFieldTags {
  optional fixed32 account_level_info_tag = 2;
  optional fixed32 privacy_info_tag = 3;
  optional fixed32 parental_control_info_tag = 4;
  repeated ProgramTag game_level_info_tags = 7;
  repeated ProgramTag game_status_tags = 9;
  repeated RegionTag game_account_tags = 11;
}

message ProgramTag {
  optional fixed32 program = 1;
  optional fixed32 tag = 2;
}

message RegionTag {
  optional fixed32 region = 1;
  optional fixed32 tag = 2;
}

message GetAccountStateResponse {
  optional AccountState state = 1;
}

message GetGameAccountStateRequest {
  optional EntityId account_id = 1 [deprecated = true];
  optional EntityId game_account_id = 2;
  optional GameAccountFieldOptions options = 10;
  optional GameAccountFieldTags tags = 11;
}

message GetGameAccountStateResponse {
  optional GameAccountState state = 1;
}

message GetLicensesResponse {
  repeated AccountLicense licenses = 1;
}

message GetGameTimeRemainingInfoResponse {
  optional uint32 minutes_remaining = 1;
  optional uint32 parental_daily_minutes_remaining = 2;
  optional uint32 parental_weekly_minutes_remaining = 3;
}

message GameSessionInfo {
  optional uint32 session_count = 1;
}

// --- GameUtilitiesService (from game_utilities_service.proto) ---

message ClientRequest {
  repeated Attribute attribute = 1;
  optional ProcessId host = 2 [deprecated = true];
  optional EntityId account_id = 3;
  optional EntityId game_account_id = 4;
  optional fixed32 program = 5;
  // 1.13.2 canonical layout (game_utilities_types.proto) adds
  // ClientInfo client_info = 6; the 1.13.2 client never populates it
  // for the Command_* realm flow (realmlist-flow audit 2026-08-05),
  // but the field number is reserved to match the wire schema.
  optional ClientInfo client_info = 6;
}

message ClientInfo {
  optional string client_address = 1;
  optional bool privileged_network = 2;
}

message ClientResponse {
  repeated Attribute attribute = 1;
}

message Attribute {
  required string name = 1;
  required Variant value = 2;
}

// Variant field numbers start at 2 (not 1). Field 1 is absent in the
// authoritative wire format. This was a field-number mismap in the
// original RE docs.
message Variant {
  optional bool bool_value = 2;
  optional int64 int_value = 3;
  optional double float_value = 4;
  optional string string_value = 5;
  optional bytes blob_value = 6;
  optional bytes message_value = 7;
  optional string fourcc_value = 8;
  optional uint64 uint_value = 9;
  optional EntityId entity_id_value = 10;
}

// LogonQueueUpdateRequest — pushed by server during login queue.
// Sent periodically to clients that opted in via
// LogonRequest.allow_logon_queue_notifications.
message LogonQueueUpdateRequest {
  optional uint32 position = 1;
  optional uint64 estimated_time = 2;
  optional uint64 eta_deviation_in_sec = 3;
}

message EntityId {
  required fixed64 high = 1;
  required fixed64 low = 2;
}

// --- SessionService (v2, from bna-core-framework) ---
// Service descriptor: bnet.protocol.session.v2.SessionService
// FNV-1a hash computed at runtime.

message SessionOptions {
  optional string mac_address = 1;
}

message SessionId {
  optional uint64 account_id = 1;
  optional GameAccountHandle game_account = 2;
  optional string instance_id = 3;
  optional uint32 region = 4;
}

message SessionVariables {
  optional uint32 keep_alive_interval = 1 [default = 50];
  optional uint32 idle_timeout = 2 [default = 600];
}

message CreateSessionRequest {
  optional GameAccountHandle game_account = 1;
  optional SessionOptions options = 2;
}

message CreateSessionResponse {
  optional SessionId session_id = 1;
  optional SessionVariables variables = 2;
}

message DestroySessionRequest {}

message UpdateSessionRequest {
  optional SessionId session_id = 1;
  optional uint32 alive_interval = 2;
}
